name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          # v4 exists only to move the action off the deprecated Node 20 runtime; its one breaking
          # change is defaulting Wrangler to v4. Pin the version the deploys have been running so
          # this stays a runtime bump and does not become an untested Wrangler major at the same time.
          wranglerVersion: "3.90.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fx-chart-analyzer --branch=main --commit-dirty=true --commit-message="deploy"
