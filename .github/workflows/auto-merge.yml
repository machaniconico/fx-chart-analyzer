# Auto-installed by setup-auto-merge.sh — turns on GitHub native auto-merge
# for every (non-draft) PR. GitHub then merges automatically once the required
# "test" status check passes and branch protection is satisfied.
name: Auto-merge
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    # update-data.yml already enables auto-merge on the data PR itself; pull_request runs for bot-authored data PRs just land action_required (approval-gated noise).
    # Workflow-touching PRs are skipped because GITHUB_TOKEN cannot enable auto-merge on them:
    # GitHub refuses enablePullRequestAutoMerge without the `workflows` scope, and that scope does
    # not exist for GITHUB_TOKEN, so this job could only ever fail (red run, no auto-merge either
    # way). Enable auto-merge by hand on those PRs — or add a PAT with `workflow` scope if they
    # should merge unattended.
    paths-ignore: ["public/data/**", ".github/workflows/**"]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
